# Copyright (c) 2021-2025 Marat Reimers

## Golden config for golangci-lint v2.15.0
#
# Based on https://github.com/maratori/golangci-lint-config

version: "2"

run:
  concurrency: 8
  timeout: 10m

issues:
  # Maximum count of issues per linter.
  # Set to 0 to disable.
  max-issues-per-linter: 0
  # Maximum count of issues with the same text.
  # Set to 0 to disable.
  max-same-issues: 0

formatters:
  enable:
    - gci
    - gofmt
    - goimports
    - golines

  settings:
    goimports:
      local-prefixes:
        - github.com/blackbirdworks/gocover-cobertura

    gci:
      no-lex-order: true
      sections:
        - standard
        - default
        - prefix(github.com/blackbirdworks/gocover-cobertura)

    gofmt:
      simplify: false
      rewrite-rules:
        - pattern: "a[b:len(a)]"
          replacement: "a[b:]"

    golines:
      max-len: 120
      reformat-tags: false

linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - depguard
    - dupl
    - durationcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exhaustruct_v5
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funcorder
    - funlen
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - gomoddirectives
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - iface
    - ineffassign
    - intrange
    - ireturn
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - mnd
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - noinlineerr
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - perfsprint
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - testableexamples
    - testifylint
    - testpackage
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - varnamelen
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5

    # extra linters matching semaphore
    - decorder
    - dogsled
    - ginkgolinter
    - godox
    - goheader
    - gomodguard_v2
    - grouper
    - importas
    - interfacebloat
    - misspell
    - zerologlint

    # candidate linters enabled in semaphore
    - arangolint
    - clickhouselint
    - dupword
    - embeddedstructfieldcheck
    - err113
    - godoclint
    - inamedparam
    - iotamixing
    - lll
    - modernize
    - nlreturn
    - paralleltest
    - prealloc
    - tagliatelle
    - thelper
    - unqueryvet

  settings:
    forbidigo:
      forbid:
        - pattern: '^(fmt\.Print(|f|ln)|print|println)$'
        - pattern: '^(testing\.(T|B|F|TB)\.(Fatal|Fatalf|Error|Errorf)|\*testing\.(T|B|F)\.(Fatal|Fatalf|Error|Errorf))$'
          msg: use testify require (instead of Fatal) or assert (instead of Error)
      analyze-types: true

    cyclop:
      max-complexity: 13
      package-average: 10.0

    depguard:
      rules:
        "deprecated":
          files:
            - "$all"
          deny:
            - pkg: github.com/golang/protobuf
              desc: Use google.golang.org/protobuf instead, see https://developers.google.com/protocol-buffers/docs/reference/go/faq#modules
            - pkg: github.com/satori/go.uuid
              desc: Use github.com/google/uuid instead, satori's package is not maintained
            - pkg: github.com/gofrs/uuid$
              desc: Use github.com/gofrs/uuid/v5 or later, it was not a go module before v5
        "non-test files":
          files:
            - "!$test"
          deny:
            - pkg: math/rand$
              desc: Use math/rand/v2 instead, see https://go.dev/blog/randv2
        "non-main files":
          files:
            - "!**/main.go"
          deny:
            - pkg: log$
              desc: Use log/slog instead, see https://go.dev/blog/slog

    embeddedstructfieldcheck:
      forbid-mutex: true

    errcheck:
      check-type-assertions: true

    exhaustive:
      check:
        - switch
        - mapliteral
      default-signifies-exhaustive: false

    exhaustruct_v5:
      ignore-patterns:
        - ^net/http\.Client$
        - ^net/http\.Cookie$
        - ^net/http\.Request$
        - ^net/http\.Response$
        - ^net/http\.Server$
        - ^net/http\.Transport$
        - ^net/url\.URL$
        - ^os/exec\.Cmd$
        - ^reflect\.StructField$
        - ^github\.com/Shopify/sarama\.Config$
        - ^github\.com/Shopify/sarama\.ProducerMessage$
        - ^github\.com/mitchellh/mapstructure\.DecoderConfig$
        - ^github\.com/prometheus/client_golang/.+Opts$
        - ^github\.com/spf13/cobra\.Command$
        - ^github\.com/spf13/cobra\.CompletionOptions$
        - ^github\.com/stretchr/testify/mock\.Mock$
        - ^github\.com/testcontainers/testcontainers-go.+Request$
        - ^github\.com/testcontainers/testcontainers-go\.FromDockerfile$
        - ^golang\.org/x/tools/go/analysis\.Analyzer$
        - ^google\.golang\.org/protobuf/.+Options$
        - ^gopkg\.in/yaml\.v3\.Node$
      enforce-patterns:
        - ^github\.com/blackbirdworks/gocover-cobertura/pkg/cobertura\.Options$
      explicit-mode: true
      allow-empty-returns: true

    funcorder:
      constructor: true
      struct-method: true

    funlen:
      lines: 100
      statements: 40

    gochecksumtype:
      default-signifies-exhaustive: false

    gocyclo:
      min-complexity: 13

    gocognit:
      min-complexity: 20

    goconst:
      min-occurrences: 3

    gocritic:
      enable-all: true
      disabled-checks:
        - unnamedResult

    godoclint:
      enable:
        - no-unused-link
        - require-stdlib-doclink

    gomoddirectives:
      replace-local: true

    govet:
      enable-all: true
      settings:
        shadow:
          strict: true

    inamedparam:
      skip-single-param: true

    ireturn:
      allow:
        - anon
        - error
        - empty
        - stdlib

    mnd:
      ignored-functions:
        - args.Error
        - flag.Arg
        - flag.Duration.*
        - flag.Float.*
        - flag.Int.*
        - flag.Uint.*
        - os.Chmod
        - os.Mkdir.*
        - os.OpenFile
        - os.WriteFile
        - prometheus.ExponentialBuckets.*
        - prometheus.LinearBuckets

    nakedret:
      max-func-lines: 0

    testpackage:
      skip-regexp: '(export|internal)_test\.go'

    nolintlint:
      allow-no-explanation: []
      require-explanation: true
      require-specific: true

    prealloc:
      simple: true
      range-loops: true
      for-loops: true

    perfsprint:
      integer-format: true
      int-conversion: true
      error-format: true
      err-error: true
      errorf: true
      sprintf1: true
      strconcat: true
      bool-format: true
      hex-format: true

    reassign:
      patterns:
        - ".*"

    revive:
      enable-all-rules: true
      rules:
        - name: line-length-limit
          disabled: true
        - name: add-constant
          disabled: true
        - name: cognitive-complexity
          disabled: true
        - name: function-length
          disabled: true
        - name: cyclomatic
          disabled: true
        - name: unchecked-type-assertion
          disabled: true
        - name: confusing-results
          disabled: true
        - name: flag-parameter
          disabled: true
        - name: nested-structs
          disabled: true
        - name: comments-density
          disabled: true
        - name: call-to-gc
          disabled: true
        - name: enforce-switch-style
          disabled: true

    sloglint:
      no-global: all
      context: scope
      attr-only: true
      static-msg: true

    staticcheck:
      checks:
        - all
        - -ST1016
        - -QF1008

    testifylint:
      enable-all: true

    unparam:
      check-exported: true

    usetesting:
      os-temp-dir: true

    varnamelen:
      ignore-type-assert-ok: true
      ignore-map-index-ok: true
      ignore-chan-recv-ok: true
      ignore-names:
        - i
        - ok
        - t
        - b
        - tb
        - w
        - r
        - ctx
        - err
        - tt
        - wg
        - mu
        - id

  exclusions:
    warn-unused: true
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      - path: '_test\.go'
        linters:
          - exhaustruct_v5
          - cyclop
          - dupl
          - funlen
          - gocognit
          - gosec
          - wrapcheck
